<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Template picker</title></head>
<body>
  <h2>Выберите шаблон</h2>
  <button onclick="send(1)">Шаблон 1</button>
  <button onclick="send(2)">Шаблон 2</button>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    function send(id) {
      Telegram.WebApp.sendData(JSON.stringify({ template_id: id }));
    }
  </script>
</body>
</html>
