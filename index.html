<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Шаблоны</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    .templates {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: var(--tg-theme-button-color, #3390ec);
      color: var(--tg-theme-button-text-color, #fff);
      font-size: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:active {
      opacity: 0.7;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .error {
      color: var(--tg-theme-destructive-text-color, #e53935);
      text-align: center;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="templates">
    <button onclick="send(1)">Шаблон 1</button>
    <button onclick="send(2)">Шаблон 2</button>
  </div>
  <div class="error" id="error"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const apiBase = params.get('api');

    async function send(templateId) {
      if (!apiBase) {
        showError('API URL not configured');
        return;
      }

      // Disable all buttons while request is in flight
      document.querySelectorAll('button').forEach(b => b.disabled = true);
      hideError();

      try {
        const resp = await fetch(apiBase + '/api/webapp/template-select', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            init_data: Telegram.WebApp.initData,
            template_id: templateId,
          }),
        });

        if (resp.ok) {
          Telegram.WebApp.close();
        } else {
          let msg = 'Ошибка сервера';
          try {
            const err = await resp.json();
            msg = err.error || msg;
          } catch (_) {}
          showError(msg);
        }
      } catch (e) {
        showError('Ошибка сети. Попробуйте ещё раз.');
      } finally {
        document.querySelectorAll('button').forEach(b => b.disabled = false);
      }
    }

    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('error').style.display = 'none';
    }

    // Expand the WebApp to full height
    Telegram.WebApp.expand();
  </script>
</body>
</html>
